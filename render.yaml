services:
  - type: web
    name: pyrolens-fire-detection
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pyrolens-gis-db
          property: connectionString
        # Optional by design: app.py falls back to the CSV output if this
        # isn't set, so the app still runs even before the DB step below
        # is completed.

databases:
  - name: pyrolens-gis-db
    plan: free
    postgresMajorVersion: "16"
    # After the database is created on Render:
    #   1. Open its web shell (or connect via psql) and run:
    #        CREATE EXTENSION postgis;
    #   2. Apply the schema:
    #        psql $DATABASE_URL -f gis/01_schema.sql
    #   3. Load real data:
    #        DATABASE_URL=<paste the same connection string> python3 gis/02_load_data.py
