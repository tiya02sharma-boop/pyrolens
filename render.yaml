services:
  - type: web
    name: pyrolens-fire-detection
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pyrolens-gis-db
          property: connectionString

  - type: cron
    name: pyrolens-realtime-poller
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python3 gis/03_realtime_poller.py
    schedule: "0 */3 * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pyrolens-gis-db
          property: connectionString
      - key: FIRMS_MAP_KEY
        sync: false

databases:
  - name: pyrolens-gis-db
    plan: free
    postgresMajorVersion: "16"